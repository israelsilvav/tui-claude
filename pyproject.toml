[project]
name = "tui-claude"
version = "0.1.0"
description = "Terminal UI for managing multiple Claude Code login profiles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prompt-toolkit>=3.0.43",
    "rich>=13.7.1",
]

[project.scripts]
tui-claude = "tui_claude.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tui_claude"]
