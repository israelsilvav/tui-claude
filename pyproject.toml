[project]
name = "tui-claude"
version = "0.1.0"
description = "Terminal UI for managing multiple Claude Code login profiles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "prompt-toolkit>=3.0.43",
    "rich>=13.7.1",
    "starlette>=0.40.0",
    "uvicorn>=0.32.0",
]

[project.scripts]
tui-claude = "tui_claude.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tui_claude"]
